<style>

<script>
(()=>{'use strict';
const PWK='hbpd-pw';/* the password is created by the user on first visit and stored only as a salted hash in this browser */

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},clock=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const nice=s=>parse(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const link=v=>{v=(v||'').trim();if(!v)return'';try{return new URL(/^https?:\/\//i.test(v)?v:'https://'+v).href}catch{return null}};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const blank=()=>({events:[],tasks:[],mail:[],log:[],notes:[],pick:0,prefs:{name:'Hasan',h24:true,focus:25,sound:true}});
let D=blank();try{D=Object.assign(blank(),JSON.parse(ls.get(KEY)||'{}'))}catch{}D.prefs=Object.assign(blank().prefs,D.prefs||{});if(!Array.isArray(D.notes))D.notes=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch{toast('Couldn’t save in this browser. Use Export backup.')}};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
let tab='today',day=fmt(new Date()),S={form:false,edit:null,sure:null,inbox:null,ibusy:false,ierr:'',draft:{to:'',tone:'Professional',notes:'',ctx:'',busy:false,err:'',res:null}};
const TABS=[['today','Today'],['sched','Schedule'],['tasks','Tasks'],['mail','Mail'],['focus','Focus'],['coffee','Coffee'],['set','Settings']];
const COFFEE=[
{n:'RAW Coffee Company',a:'Al Quoz',t:['Roastery','Beans'],x:'One of Dubai’s pioneers in specialty roasting. Buy fresh bags at the roastery or try the espresso bar.'},
{n:'Grandmother Coffee Roastery',a:'Al Quoz',t:['Roastery','Beans'],x:'A small, hand-run roastery where the craft of the cup comes first.'},
{n:'Specialty Batch Coffee Roasters',a:'Al Quoz',t:['Roastery','Beans'],x:'A roaster built around high-grade arabica, and a good stop for beans.'},
{n:'Cypher Urban Roastery',a:'Dubai',t:['Roastery','Beans'],x:'An independent Dubai roaster that regularly turns up on best-of lists.'},
{n:'Emirati Coffee Roastery',a:'Dubai',t:['Roastery','Beans','Arabic coffee'],x:'A local roastery known for custom blends, and a way to taste a regional take on coffee.'},
{n:'Boon Coffee',a:'Dubai',t:['Roastery','Beans'],x:'An Ethiopian-owned Dubai roaster working with farm-sourced beans.'},
{n:'The Climbing Goat Roastery',a:'Palm Jumeirah Mall',t:['Roastery','Café'],x:'A roastery counter in the Depachika food hall serving filter, V60 and espresso.'},
{n:'Julith',a:'Dubai',t:['Roastery','Café'],x:'A roastery, brew lounge and concept store under one roof.'},
{n:'The Espresso Lab',a:'Dubai Design District',t:['Café','Beans'],x:'A brewing-focused coffee house that says it visits its coffee sources in person.'},
{n:'Toby’s Estate',a:'Several locations',t:['Café','Beans'],x:'An Australian roaster with several cafés across the city.'},
{n:'Tom & Serg',a:'Al Quoz',t:['Café'],x:'A warehouse-style café with specialty coffee and good food.'},
{n:'Roseleaf',a:'Dubai Garden Centre',t:['Café'],x:'An independent café serving single-origin coffee, tucked inside a garden centre.'},
{n:'The Sum of Us',a:'Dubai',t:['Café','Roastery'],x:'A bakery, coffee roastery and eatery in one place.'},
{n:'Alchemy',a:'Jumeirah 2',t:['Café'],x:'A specialty café known for the way its coffee menu is displayed on the wall.'},
{n:'Typica',a:'Umm Suqeim',t:['Café'],x:'A specialty café that opened its first branch in Umm Suqeim.'}];
const map=c=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.n+' '+c.a+' Dubai');
const doy=()=>Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);

const clashes=l=>{const s=new Set;l.forEach((a,i)=>l.forEach((b,j)=>{if(i<j&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end)){s.add(a.id);s.add(b.id)}}));return s};

const V={
today(){const t=fmt(new Date()),n=new Date(),nm=n.getHours()*60+n.getMinutes(),h=n.getHours(),left=evs(t).filter(e=>!e.done&&mins(e.end)>nm),nx=left[0],due=D.tasks.filter(x=>!x.done&&x.due&&x.due<=t).sort(byDue),rep=D.mail.filter(x=>!x.done).length,fm=D.log.filter(l=>l.d===t).reduce((a,l)=>a+l.mins,0);
 return `<h2>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}, ${esc(D.prefs.name)}</h2><p class="sub">${nice(t)}</p><div class="grid">${stat(left.length,'Meetings left today')}${stat(due.length,'Deadlines due or overdue')}${stat(rep,'Replies waiting')}${stat(fm+' min','Focused today')}</div>
 <div class="card"><h3>Up next</h3>${nx?`<p style="margin:0 0 10px"><span class="tm">${tf(nx.start)}–${tf(nx.end)}</span> ${esc(nx.title)}</p>${joinBtn(nx.link)}`:'<p class="muted">Nothing else scheduled today.</p>'}</div>
 <div class="card"><h3>Due today and overdue</h3>${due.length?due.map(taskRow).join(''):'<p class="muted">Nothing due. Nice.</p>'}</div>
 <div class="card"><h3>Quick start</h3><div class="acts" style="margin:0"><button class="btn dark" data-act="fq" data-n="${D.prefs.focus}">Focus for ${D.prefs.focus} min</button><a class="btn" href="https://outlook.office.com/mail/" target="_blank" rel="noopener">Open Outlook</a><a class="btn" href="https://teams.microsoft.com/" target="_blank" rel="noopener">Open Teams</a><button class="btn" data-tab="coffee">Today’s coffee</button></div></div>`},
sched(){const l=evs(day),c=clashes(l),now=new Date(),isT=day===fmt(now),nm=now.getHours()*60+now.getMinutes(),ed=S.edit&&D.events.find(x=>x.id===S.edit);
 const form=S.form?`<div class="card"><div class="row"><div><label for="f-t">Title</label><input id="f-t" maxlength="120" value="${esc(ed&&ed.title)}"></div><div><label for="f-s">Start</label><input id="f-s" type="time" value="${ed?ed.start:'09:00'}"></div><div><label for="f-e">End</label><input id="f-e" type="time" value="${ed?ed.end:'10:00'}"></div></div><label for="f-l">Teams or meeting link (optional)</label><input id="f-l" placeholder="Paste the join link" value="${esc(ed&&ed.link)}"><div class="acts"><button class="btn dark" data-act="save">${ed?'Save changes':'Add to schedule'}</button><button class="btn" data-act="cancel">Cancel</button></div></div>`:'';
 const cards=l.map(e=>{const live=isT&&!e.done&&nm>=mins(e.start)&&nm<mins(e.end);return `<div class="ev ${e.done?'done':''} ${live?'now':''}"><span class="tm">${tf(e.start)}–${tf(e.end)}</span>${live?'<span class="tag">Now</span>':''}${c.has(e.id)?'<span class="tag bad">Overlaps</span>':''}<div class="tx" style="margin:4px 0 2px;font-weight:500">${esc(e.title)}</div><div class="acts" style="margin-top:8px">${joinBtn(e.link)}<button class="btn sm" data-act="done" data-id="${e.id}">${e.done?'Undo':'Mark done'}</button><button class="btn sm" data-act="edit" data-id="${e.id}">Edit</button><button class="btn sm" data-act="del" data-id="${e.id}">Delete</button></div></div>`}).join('');
 return `<div class="datebar"><h2>${isT?'Today · ':''}${nice(day)}</h2><button class="btn sm" data-act="prev" aria-label="Previous day">‹</button><input id="dp" type="date" value="${day}" aria-label="Date"><button class="btn sm" data-act="next" aria-label="Next day">›</button><button class="btn sm" data-act="today">Today</button></div>${S.form?form:'<button class="btn dark" data-act="new" style="margin-bottom:16px">Add meeting or block</button>'}${l.length?cards:'<div class="empty">Nothing planned for this day.</div>'}`},

mail(){const l=[...D.mail].sort((a,b)=>(a.done-b.done)||a.t-b.t),n=D.mail.filter(x=>!x.done).length,tok=ls.get('hb-ms'),dr=S.draft;
